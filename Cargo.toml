[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
chat-core = { path = "crates/chat-core" }
chat-server = { path = "crates/chat-server" }
chat-discovery = { path = "crates/chat-discovery" }
chat-transport-quic = { path = "crates/chat-transport-quic" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
sea-query = "0.32"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
