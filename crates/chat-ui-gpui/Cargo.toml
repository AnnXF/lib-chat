[package]
name = "chat-ui-gpui"
edition = "2024"
version.workspace = true

[[bin]]
name = "libchat-ui"
path = "src/bin/libchat-ui/main.rs"

[dependencies]
chat-core.workspace = true
chat-server.workspace = true
chat-discovery.workspace = true
chat-transport-quic.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread"] }
gpui = "0.2.2"
unicode-segmentation = "1.13.3"
flume = "0.12.0"
if-addrs = "0.15.0"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[features]
# 无头 UI 布局测试：启用 gpui 的测试平台与元素边界查询。
ui-test = ["gpui/test-support"]

[dev-dependencies]
async-trait.workspace = true
rcgen = "0.14.10"
